name: Build IPA (unsigned, for AltStore)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BLERadar.xcodeproj \
            -scheme BLERadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BLERadar.app" Payload/
          zip -qr BLERadar-unsigned.ipa Payload
          ls -lh BLERadar-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLERadar-unsigned-ipa
          path: BLERadar-unsigned.ipa
